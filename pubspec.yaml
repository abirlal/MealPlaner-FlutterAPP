name: mealPlanner
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.2.0 
  carousel_slider: ^5.0.0
  http: 1.1.0
  provider: ^6.0.0  # Example of another dependency
  qr_flutter: ^4.1.0 
  intl: ^0.19.0 
  cupertino_icons: ^1.0.2
  
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^2.0.0
  
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/menus/
    - assets/images/topmenu/
    - assets/images/popular_foods/
    - assets/images/bestfood/



